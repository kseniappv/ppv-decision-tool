{{- if and .Values.app.vault.enabled (ne .Values.werf.env "review") }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
spec:
  vaultAuthRef: vault-secrets-operator/default
  mount: {{ .Values.app.vault.mount }}
  # CH_USER / CH_PASSWORD live here.
  path: prototype/ppv-decision-tool/{{ .Values.werf.env }}/secret
  type: {{ .Values.app.vault.type }}
  destination:
    name: {{ .Chart.Name }}-vault-secrets
    create: true
    type: Opaque
  # Restart the pod when creds rotate — envFrom is read only at container start.
  rolloutRestartTargets:
  - kind: Deployment
    name: {{ .Chart.Name }}
  refreshAfter: 30s
{{- end }}
