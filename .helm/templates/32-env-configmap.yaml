apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-env-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
data:
  ENV: "{{ .Values.werf.env }}"
  CH_HOST: "{{ pluck .Values.werf.env .Values.app.clickhouse.host | first | default .Values.app.clickhouse.host._default }}"
  CH_PORT: "{{ pluck .Values.werf.env .Values.app.clickhouse.port | first | default .Values.app.clickhouse.port._default }}"
